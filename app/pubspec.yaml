name: jfzreader
description: "Chinese-first bilingual offline reader for Novelia-compatible Web Novels."
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.0
  webview_flutter: ^4.14.1
  xml: ^6.6.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
