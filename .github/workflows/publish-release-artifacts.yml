name: Publish release artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to build and update
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.9'
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  checks:
    name: Flutter checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve dependencies
        working-directory: app
        run: flutter --no-version-check pub get

      - name: Analyze
        working-directory: app
        run: flutter --no-version-check analyze

      - name: Test
        working-directory: app
        run: flutter --no-version-check test

  android:
    name: Build signed Android APK
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: app/android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve dependencies
        working-directory: app
        run: flutter --no-version-check pub get

      - name: Write Android release keystore
        env:
          JFZREADER_ANDROID_STORE_BASE64: ${{ secrets.JFZREADER_ANDROID_STORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${JFZREADER_ANDROID_STORE_BASE64}" ]]; then
            echo "Missing GitHub secret JFZREADER_ANDROID_STORE_BASE64." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/jfzreader-release.jks"
          printf '%s' "$JFZREADER_ANDROID_STORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          echo "JFZREADER_ANDROID_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: app
        env:
          JFZREADER_ANDROID_STORE_PASSWORD: ${{ secrets.JFZREADER_ANDROID_STORE_PASSWORD }}
          JFZREADER_ANDROID_KEY_ALIAS: ${{ secrets.JFZREADER_ANDROID_KEY_ALIAS }}
          JFZREADER_ANDROID_KEY_PASSWORD: ${{ secrets.JFZREADER_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            JFZREADER_ANDROID_STORE_FILE \
            JFZREADER_ANDROID_STORE_PASSWORD \
            JFZREADER_ANDROID_KEY_ALIAS \
            JFZREADER_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing Android signing input $name." >&2
              exit 1
            fi
          done
          flutter --no-version-check build apk --release

      - name: Verify and prepare signed APK
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG//\//-}"
          apk="app/build/app/outputs/flutter-apk/app-release.apk"
          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(ls -1 "$android_home"/build-tools/*/apksigner | sort | tail -n 1)"
          test -x "$apksigner"
          APKSIGNER="$apksigner" app/scripts/verify_android_release.sh "$apk"
          mkdir -p dist
          cp "$apk" "dist/JFZ-Reader-${tag}-android.apk"

      - name: Upload Android build artifact
        uses: actions/upload-artifact@v7
        with:
          name: jfzreader-release-android
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  ios:
    name: Build unsigned iOS IPA
    needs: checks
    runs-on: macos-14
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve dependencies
        working-directory: app
        run: flutter --no-version-check pub get

      - name: Build unsigned iOS app
        working-directory: app
        run: flutter --no-version-check build ios --release --no-codesign

      - name: Package unsigned IPA
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG//\//-}"
          ios_app="$(find app/build/ios/iphoneos -type d -name '*.app' -print -prune | head -n 1)"
          test -n "$ios_app"
          test -d "$ios_app"
          test ! -d "$ios_app/_CodeSignature"

          rm -rf ios-payload dist
          mkdir -p ios-payload/Payload dist
          ditto "$ios_app" "ios-payload/Payload/$(basename "$ios_app")"
          (
            cd ios-payload
            zip -qry "../dist/JFZ-Reader-${tag}-ios-unsigned.ipa" Payload
          )
          test -s "dist/JFZ-Reader-${tag}-ios-unsigned.ipa"

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v7
        with:
          name: jfzreader-release-ios
          path: dist/*.ipa
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  macos:
    name: Build macOS DMG
    needs: checks
    runs-on: macos-14
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve dependencies
        working-directory: app
        run: flutter --no-version-check pub get

      - name: Build macOS app
        working-directory: app
        run: flutter --no-version-check build macos --release

      - name: Package DMG
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG//\//-}"
          macos_app="$(find app/build/macos/Build/Products/Release -type d -name '*.app' -print -prune | head -n 1)"
          test -n "$macos_app"
          test -d "$macos_app"

          rm -rf dmg-root dist
          mkdir -p dmg-root dist
          ditto "$macos_app" "dmg-root/JFZ Reader.app"
          ln -s /Applications "dmg-root/Applications"
          hdiutil create \
            -volname "JFZ Reader ${tag}" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "dist/JFZ-Reader-${tag}-macos.dmg"
          test -s "dist/JFZ-Reader-${tag}-macos.dmg"

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v7
        with:
          name: jfzreader-release-macos
          path: dist/*.dmg
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    name: Attach assets to GitHub Release
    needs: [android, ios, macos]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: jfzreader-release-*
          path: dist
          merge-multiple: true

      - name: Validate release assets
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG//\//-}"
          for asset in \
            "dist/JFZ-Reader-${tag}-android.apk" \
            "dist/JFZ-Reader-${tag}-ios-unsigned.ipa" \
            "dist/JFZ-Reader-${tag}-macos.dmg"; do
            test -s "$asset"
          done
          find dist -maxdepth 1 -type f -print

      - name: Create GitHub Release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG//\//-}"
          gh release upload "$RELEASE_TAG" \
            "dist/JFZ-Reader-${tag}-android.apk" \
            "dist/JFZ-Reader-${tag}-ios-unsigned.ipa" \
            "dist/JFZ-Reader-${tag}-macos.dmg" \
            --repo "$GH_REPO" \
            --clobber
